name: Build PhotoRefSorter Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - "main.py"
      - "PhotoRefSorter.spec"
      - "requirements-build.txt"
      - ".github/workflows/build-windows-exe.yml"

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt

      - name: Download AI models
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path models | Out-Null
          Invoke-WebRequest -Uri "https://media.githubusercontent.com/media/opencv/opencv_zoo/main/models/face_detection_yunet/face_detection_yunet_2023mar.onnx" -OutFile "models/face_detection_yunet_2023mar.onnx"
          Invoke-WebRequest -Uri "https://media.githubusercontent.com/media/opencv/opencv_zoo/main/models/face_recognition_sface/face_recognition_sface_2021dec.onnx" -OutFile "models/face_recognition_sface_2021dec.onnx"
          if ((Get-Item "models/face_detection_yunet_2023mar.onnx").Length -lt 100000) { throw "YuNet model download invalid" }
          if ((Get-Item "models/face_recognition_sface/face_recognition_sface_2021dec.onnx" -ErrorAction SilentlyContinue)) { Write-Host "" }
          if ((Get-Item "models/face_recognition_sface_2021dec.onnx").Length -lt 1000000) { throw "SFace model download invalid" }

      - name: Build one-file EXE
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean PhotoRefSorter.spec
          if (!(Test-Path "dist/PhotoRefSorter.exe")) { throw "EXE was not generated" }

      - name: Self-test packaged AI engine
        shell: pwsh
        run: |
          $p = Start-Process -FilePath ".\dist\PhotoRefSorter.exe" -ArgumentList "--self-test" -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "EXE self-test failed: $($p.ExitCode)" }

      - name: Create SHA256
        shell: pwsh
        run: |
          (Get-FileHash "dist/PhotoRefSorter.exe" -Algorithm SHA256).Hash | Out-File -Encoding ascii "dist/PhotoRefSorter.exe.sha256.txt"

      - name: Upload finished EXE
        uses: actions/upload-artifact@v4
        with:
          name: PhotoRefSorter-Windows
          path: |
            dist/PhotoRefSorter.exe
            dist/PhotoRefSorter.exe.sha256.txt
          if-no-files-found: error
          compression-level: 0
